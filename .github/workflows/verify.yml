name: Verify provider
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/acceptance.py --repository build/ci-repository
      - name: Build and verify Cafe samples
        run: >-
          bash gradlew -p samples -PtestRepository=${{ github.workspace }}/build/ci-repository
          :kotlin:assembleDebug :java:assembleDebug
          :kotlin:assembleRelease :java:assembleRelease
          :kotlin:testDebugUnitTest :java:testDebugUnitTest
          :kotlin:lintDebug :java:lintDebug
          :kotlin:lintRelease :java:lintRelease
          :kotlin:assembleDebugAndroidTest :java:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-verification
          path: |
            build/acceptance/
            provider/build/reports/
            consumer-tests/java/build/reports/
            consumer-tests/kotlin/build/reports/
            consumer-tests/java/build/test-results/
            consumer-tests/kotlin/build/test-results/
            provider/build/outputs/aar/
            samples/kotlin/build/reports/
            samples/java/build/reports/
            samples/kotlin/build/outputs/apk/
            samples/java/build/outputs/apk/
